<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Algorithm Breaker</h2>
    <p>Discover something outside your bubble.</p>

    <label for="topic">Select Mode / Topic:</label>
    <select id="topic">
      <option value="wildcard">🎲 Pure Random (Raw Uploads)</option>
      <option value="history">📜 Ancient History & Archaeology</option>
      <option value="science">🔬 Quantum Physics & Space</option>
      <option value="nature">🌿 Deep Sea & Marine Biology</option>
      <option value="tech">💻 Obscure Tech & Vintage Hardware</option>
      <option value="philosophy">🧠 Epistemology & Thought Experiments</option>
      <option value="crafts">🎨 Rare Crafts & Woodworking</option>
    </select>

    <button id="discoverBtn">Break My Algorithm</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
